[build]
  publish = "public"
  functions = "netlify/functions"
  command = "echo 'No build step needed'"

# La apiKey web de Firebase es PÚBLICA por diseño (la seguridad la dan las
# reglas de Firestore, no el ocultamiento de la clave). El escáner de secretos
# de Netlify la marca como falso positivo, así que lo desactivamos.
[build.environment]
  SECRETS_SCAN_ENABLED = "false"

[functions]
  node_bundler = "esbuild"

# SPA: todas las rutas sirven index.html (el router cliente decide)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # CSP — Firebase Auth + Firestore + Google Fonts. Agregar dominios al sumar servicios.
    Content-Security-Policy = "default-src 'self' https://*.firebaseio.com https://*.googleapis.com https://*.gstatic.com https://*.firebaseapp.com; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://www.gstatic.com https://*.gstatic.com https://apis.google.com https://accounts.google.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com https://*.gstatic.com https://*.firebaseapp.com https://firestore.googleapis.com https://accounts.google.com; frame-src 'self' https://*.firebaseapp.com https://accounts.google.com https://www.youtube.com"
